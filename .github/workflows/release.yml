name: Release

# Faz o versionamento de verdade: sempre que a versao em backend/package.json
# muda na main (ou seja, um PR que bumpou a versao foi mergeado), cria a tag
# vX.Y.Z e uma GitHub Release com as notas geradas automaticamente a partir
# dos PRs mergeados desde a ultima release. Nao inventa a versao sozinho -
# quem decide o bump (patch/minor/major) e o PR, isso aqui so oficializa.

on:
  push:
    branches: [main]
    paths:
      - 'backend/package.json'

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versao do backend/package.json
        id: version
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Conferir que frontend e backend estao na mesma versao
        run: |
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$FRONTEND_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::backend (${{ steps.version.outputs.version }}) e frontend ($FRONTEND_VERSION) estao com versoes diferentes"
            exit 1
          fi

      - name: Ja existe tag pra essa versao?
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # As notas saem do CHANGELOG, nao da lista de commits: quem le a
      # release quer saber o que mudou e por que, nao a sequencia de merges.
      - name: Extrair a secao da versao no CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            echo "from_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md nao tem secao para $VERSION - caindo para notas geradas dos commits"
            echo "from_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar tag e GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          if [ "${{ steps.notes.outputs.from_changelog }}" = "true" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
