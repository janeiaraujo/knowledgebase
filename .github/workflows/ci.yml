name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    name: Versao sincronizada (backend/frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que backend e frontend estao na mesma versao
        run: |
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          echo "backend: $BACKEND_VERSION | frontend: $FRONTEND_VERSION"
          if [ "$BACKEND_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "::error::backend ($BACKEND_VERSION) e frontend ($FRONTEND_VERSION) estao com versoes diferentes - a release so tagueia quando estiverem sincronizadas"
            exit 1
          fi

  backend:
    name: Backend (install + smoke test)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/incident_intelligence_ci
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create database indexes
        run: npm run migrate

      - name: Seed demo data
        run: npm run seed

      - name: Run smoke test
        run: npm run smoke-test

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
