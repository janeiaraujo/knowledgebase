name: CI

on:
  push:
    branches: [main]
  # Sem filtro de branch de destino: PR empilhado sobre outra branch
  # (base != main) tambem precisa de CI. Com o filtro anterior ele ficava
  # sem nenhum check, e a protecao da main so cobria o PR de baixo.
  pull_request:

jobs:
  version-sync:
    name: Versao sincronizada (backend/frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que backend e frontend estao na mesma versao
        run: |
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          echo "backend: $BACKEND_VERSION | frontend: $FRONTEND_VERSION"
          if [ "$BACKEND_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "::error::backend ($BACKEND_VERSION) e frontend ($FRONTEND_VERSION) estao com versoes diferentes - a release so tagueia quando estiverem sincronizadas"
            exit 1
          fi

  # Avisa, sem bloquear, quando um PR muda codigo de produto e nao bumpa a
  # versao. Nao e erro: PR de doc, teste ou CI nao precisa de release. Mas ja
  # aconteceu tres vezes de varios PRs entrarem seguidos sem ninguem bumpar, e
  # o release ficar para tras - inclusive com correcao de seguranca dentro.
  aviso-de-release:
    name: Aviso de release pendente
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A versao acompanha as mudancas de produto?
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          VERSAO_PR=$(node -p "require('./backend/package.json').version")
          VERSAO_BASE=$(git show "$BASE:backend/package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")

          MUDOU_PRODUTO=$(git diff --name-only "$BASE"...HEAD \
            | grep -E '^(backend/src/|frontend/src/)' | head -1 || true)

          if [ -z "$MUDOU_PRODUTO" ]; then
            echo "PR nao mexe em codigo de produto - nada a avisar."
            exit 0
          fi

          if [ "$VERSAO_PR" != "$VERSAO_BASE" ]; then
            echo "Versao bumpada: $VERSAO_BASE -> $VERSAO_PR."
            exit 0
          fi

          echo "::warning title=Release vai ficar para tras::Este PR muda codigo de produto e mantem a versao em $VERSAO_PR. Sem bump em backend/package.json E frontend/package.json, o workflow de release nao dispara e a mudanca fica sem tag. Se for intencional (agrupar com outros PRs), tudo bem - so lembre de bumpar antes de encerrar o ciclo."
          {
            echo "### Release vai ficar para tras"
            echo ""
            echo "Este PR mexe em \`backend/src/\` ou \`frontend/src/\` e mantem a versao em **$VERSAO_PR**."
            echo ""
            echo "Sem bump nos dois \`package.json\`, o workflow de release nao dispara ao mergear."
            echo "Se a intencao e agrupar varios PRs numa release so, ignore - mas nao esqueca do bump no ultimo."
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend (install + smoke test)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/incident_intelligence_ci
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint primeiro: falha em segundos, sem banco, e pega a classe de erro
      # que o build nao pega - variavel fora de escopo, hook condicional.
      - name: Lint
        run: npm run lint

      # Testes de unidade rodam antes do banco: nao dependem de Mongo e
      # falham rapido se a logica de permissao/auth quebrou.
      - name: Run unit tests
        run: npm test

      - name: Create database indexes
        run: npm run migrate

      - name: Seed demo data
        run: npm run seed

      - name: Run smoke test
        run: npm run smoke-test

      # Depois do smoke: sobe a API contra o Mongo e prova o isolamento
      # entre duas organizacoes de verdade. Usa base propria
      # (incident_kb_itest) e a dropa no final, entao nao encosta nos
      # dados que o seed criou.
      - name: Testes de integracao (isolamento multi-tenant)
        run: npm run test:integration

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Rodam antes do build porque pegam o que o build nao pega: chave de
      # traducao quebrada aparece como caminho da chave na tela, e tela que
      # estoura ao renderizar compila sem um aviso sequer.
      - name: Testes (i18n e render)
        run: npm test

      - name: Build
        run: npm run build
