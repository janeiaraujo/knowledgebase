server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos com hash no nome (index-a1b2c3.js) nunca mudam de conteudo:
    # cache longo e seguro e evita rebaixar o ganho do code splitting.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nao pode ser cacheado: e ele que aponta para os assets novos
    # depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota que nao seja arquivo cai no index, senao um F5 em
    # /kb/123 devolveria 404 do nginx em vez de abrir a aplicacao.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Antes do /api/ de proposito: o WebSocket vive em /api/ws/notifications e
    # precisa dos cabecalhos de Upgrade, que o location generico nao repassa.
    location /api/ws {
        proxy_pass http://backend:3000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de imagem e importacao de arquivo passam por aqui.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:3000/health;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
